# Generic clinic booking bot ("Clinic - Booking bot", @ClinicBookingAssistant_bot) — clinic settings.
# Same behaviour as the n8n workflow "Clinic - Booking bot": generic clinic details, waitlist, 3 languages.
# Copy this file to config/clinic.yaml (or paste it into the CLINIC_CONFIG_YAML variable on Railway) and edit it.
# Restart the bot after changes.

# Languages. With more than one, /start asks the patient to choose (🇦🇲 / 🇬🇧 / 🇷🇺) and every message is translated.
# English and Russian texts come from n8n/clinic-i18n.json. Use [hy] for an Armenian-only bot.
languages: [hy, en, ru]

clinic:
  name: "Բժշկական կլինիկա"
  open: "09:00"            # clinic opening time (doctor shifts are cut to these hours)
  close: "18:00"
  phone: "+374 10 000000"
  mobile: "+374 90 000000"
  hours_text: "Երկ–Ուրբ 09:00–18:00"
  address_short: "Երևան, Կենտրոն"
  address_lines:
    - "Բժշկական կլինիկա"
    - "Երևան, Կենտրոն"
  # How the clinic is named inside fixed sentences (Armenian grammar needs a different form in each).
  phrases:
    welcome_place: "մեր կլինիկա"          # Բարի գալուստ ___։
    thanks_to: "մեր կլինիկային"           # Շնորհակալություն, որ դիմեցիք ___ 🦷
    contact_title: "Կապ կլինիկայի հետ"    # 📞 ___
    reminder_at: "մեր կլինիկայում"        # ⏰ Հիշեցում՝ վաղը Ձեր այցն է ___։
    rating_at: "մեր կլինիկայում"          # 🦷 Ինչպե՞ս անցավ Ձեր այցը ___
    created_by: "ամրագրման բոտի"          # (calendar event) Ստեղծվել է ___ կողմից …
  links:
    telegram: "https://t.me/+37490000000"
    whatsapp: "https://wa.me/37490000000"
    viber: "https://viber.click/+37490000000"
    instagram: "https://www.instagram.com/"
    route: "https://yandex.com/maps/?rtext=~40.177628%2C44.512546&rtt=auto"
    map: "https://yandex.com/maps/?ll=44.512546%2C40.177628&z=16&pt=44.512546%2C40.177628"
    reviews: "https://yandex.com/maps/?ll=44.512546%2C40.177628&z=16&pt=44.512546%2C40.177628"

booking:
  step_minutes: 30          # start times are offered every 30 minutes
  lead_minutes: 15          # no booking closer than 15 minutes from now
  max_days_ahead: 62        # how far ahead patients may book
  request_ttl_hours: 2      # a request waits this long for the doctor's answer
  # Calendar event titles: when several doctors share ONE calendar, events are matched
  # to a doctor by the doctor's name in the event title.
  event_title_prefix: ""    # e.g. "[TEST] " while testing

# Specialty keys -> service name shown to patients + default visit length.
specialties:
  general:      { name: "Ընդհանուր խորհրդատվություն", minutes: 30 }
  pediatric:    { name: "Մանկական ստոմատոլոգիա", minutes: 30 }
  orthodontics: { name: "Օրթոդոնտիա", minutes: 60 }
  surgery:      { name: "Ատամնաբուժական վիրաբուժություն", minutes: 90 }

# "Choose by service" menu (button label = specialty name).
service_menu: [general, pediatric, orthodontics]

# Visit reasons asked right after the doctor is chosen. They set the visit length.
# Prices are SAMPLE values — replace them with the clinic's real prices.
reasons:
  - { key: consult, label: "🩺 Խորհրդատվություն", name: "Խորհրդատվություն / զննում", minutes: 30, price: "5 000 ֏", specialties: [general, pediatric, orthodontics, surgery] }
  - { key: pain,    label: "⚡ Սուր ցավ", name: "Սուր ցավ (շտապ այց)", minutes: 30, price: "8 000 ֏-ից", specialties: [general, pediatric, orthodontics, surgery] }
  - { key: treat,   label: "🦷 Ատամի բուժում", name: "Ատամի բուժում (կարիես, լցոնում)", minutes: 60, price: "15 000 ֏-ից", specialties: [general, pediatric] }
  - { key: clean,   label: "🪥 Մասնագիտական մաքրում", name: "Մասնագիտական մաքրում", minutes: 60, price: "20 000 ֏", specialties: [general] }
  - { key: ortho,   label: "😁 Օրթոդոնտիկ բուժում", name: "Օրթոդոնտիկ բուժում (բրեկետներ, կապեր)", minutes: 60, price: "30 000 ֏-ից", specialties: [orthodontics] }
  - { key: surgery, label: "🔧 Հեռացում / վիրահատություն", name: "Ատամի հեռացում / վիրահատություն", minutes: 90, price: "25 000 ֏-ից", specialties: [surgery] }

price_note: "Գները նախնական են․ վերջնական արժեքը բժիշկը կասի զննումից հետո։"

# Doctors. calendar_id = the doctor's Google Calendar ID (share it with the service account). All doctors may share
# one calendar: events are then matched to a doctor by the doctor's name in the event title.
# approver_chat_id = Telegram chat ID of the person who approves this doctor's requests
# (send /myid to the bot to see your chat ID). The same person may approve for several doctors.
# shift: start/end on Mon–Thu, friday_end optional. Bios and hours are SAMPLE texts.
doctors:
  - key: aram
    name: "Արամ Սարգսյան"
    specialty: general
    calendar_id: "REPLACE_WITH_CALENDAR_ID@group.calendar.google.com"
    approver_chat_id: "REPLACE_WITH_TELEGRAM_CHAT_ID"
    info_label: "ℹ️ Արամի մասին"
    shift: { start: "09:00", end: "15:00" }
    hours_text: "Երկ–Ուրբ 09:00–15:00"
    bio: "Ընդհանուր ստոմատոլոգ · 12 տարվա փորձ\nԱխտորոշում, կարիեսի բուժում, լցոնումներ, կանխարգելիչ զննումներ։"
  - key: ani
    name: "Անի Մկրտչյան"
    specialty: general
    calendar_id: "REPLACE_WITH_CALENDAR_ID@group.calendar.google.com"
    approver_chat_id: "REPLACE_WITH_TELEGRAM_CHAT_ID"
    info_label: "ℹ️ Անիի մասին"
    shift: { start: "12:00", end: "18:00" }
    hours_text: "Երկ–Ուրբ 12:00–18:00"
    bio: "Ընդհանուր ստոմատոլոգ · 8 տարվա փորձ\nԳեղագիտական վերականգնումներ, լցոնումներ, ատամների մաքրում։"
  - key: lilit
    name: "Լիլիթ Հարությունյան"
    specialty: general
    calendar_id: "REPLACE_WITH_CALENDAR_ID@group.calendar.google.com"
    approver_chat_id: "REPLACE_WITH_TELEGRAM_CHAT_ID"
    info_label: "ℹ️ Լիլիթի մասին"
    shift: { start: "10:00", end: "16:00" }
    hours_text: "Երկ–Ուրբ 10:00–16:00"
    bio: "Ընդհանուր ստոմատոլոգ · 6 տարվա փորձ\nԿարիեսի բուժում, մասնագիտական մաքրում, խորհրդատվություն։"
  - key: narek
